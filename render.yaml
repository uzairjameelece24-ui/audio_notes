databases:
  - name: audio-notes-db
    databaseName: audio_notes
    user: postgres
    plan: free

services:
  - type: web
    name: audio-notes-backend
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: audio-notes-db
          property: connectionString
      - key: ASR_MODE
        value: real
      - key: LLM_MODE
        value: real
      - key: GNANI_API_URL
        value: https://api.vachana.ai/stt/v3
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b
      - key: CORS_ORIGINS
        value: "*"
      - key: GNANI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_BUCKET_NAME
        value: audio-notes
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: us-east-1
